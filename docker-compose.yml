services:
  sql-injection-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sql-injection-agent
    ports:
      - "4003:4003"
    env_file:
      - .env
    environment:
      - PORT=4003
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-gpt-4o}
    restart: unless-stopped
